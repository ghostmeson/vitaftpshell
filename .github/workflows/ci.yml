name: Host tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Layering guard and host suites
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Run host suites
        run: ./tools/test/run.sh

      - name: Sanitizers over every suite
        run: ./tools/test/asan.sh

      - name: Render the preview
        run: ./tools/preview/run.sh

      - name: Ordering check (expected race without release/acquire)
        run: ./tools/test/tsan.sh

      - name: Upload preview
        uses: actions/upload-artifact@v7
        with:
          # Upload the directory, not one file: the renderer names its states
          # per surface, and pinning a single filename broke the upload when
          # that name changed.
          name: previews
          path: build/preview
          if-no-files-found: error
